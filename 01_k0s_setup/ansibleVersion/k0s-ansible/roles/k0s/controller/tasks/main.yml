---

- name: "Write the k0s token file on controller"
  template:
    src: controller-token.j2
    dest: "{{ k0s_config_dir }}/controller-token"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0600

- name: Stop and disable k0s controller service
  systemd:
    name: k0scontroller.service
    state: stopped
    enabled: no
  become: true

- name: Remove k0s controller service file
  file:
    path: /etc/systemd/system/k0scontroller.service
    state: absent
  become: true

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: true

- name: Create k0s controller service with install command
  register: install_controller_cmd
  command: k0s install controller  --config {{ k0s_config_dir }}/k0s.yaml --token-file {{ k0s_config_dir }}/controller-token {{ extra_args | default('') }}
  changed_when: install_controller_cmd | length > 0
  become: true
  ignore_errors: yes

  
- name: Setup custom environment variables for systemd unit
  include_role:
    name: env_setup

- name: "Enable and check k0s service"
  become: true
  systemd:
    name: k0scontroller
    daemon_reload: yes
    state: restarted
    enabled: yes

- name: "Wait for k8s apiserver"
  wait_for:
    host: localhost
    port: 6443
    timeout: 180
